apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: researchradar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Lakshya-prasad/ResearchRadar.git'
    path: k8s/helm/researchradar
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-local.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
