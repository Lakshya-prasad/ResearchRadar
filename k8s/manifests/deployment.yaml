apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchradar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: researchradar
  template:
    metadata:
      labels:
        app: researchradar
    spec:
      containers:
        - name: researchradar
          image: 794562053920.dkr.ecr.us-east-1.amazonaws.com/researchradar:latest
          ports:
            - containerPort: 5000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: researchradar-secrets
                  key: GROQ_API_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: researchradar-secrets
                  key: SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3